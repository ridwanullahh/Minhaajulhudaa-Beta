<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05B34D"/>
      <stop offset="100%" style="stop-color:#048A3E"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B91C"/>
      <stop offset="100%" style="stop-color:#E0A800"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <!-- Islamic geometric star pattern (8-pointed star) -->
  <path d="M32 8 L38 18 L48 14 L44 24 L54 30 L44 36 L48 46 L38 42 L32 52 L26 42 L16 46 L20 36 L10 30 L20 24 L16 14 L26 18 Z" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linejoin="round" opacity="0.4"/>
  <!-- Open book (Qur'an) at center -->
  <path d="M16 28 L32 24 L48 28 L48 44 L32 40 L16 44 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M32 24 L32 40" stroke="url(#bg-grad)" stroke-width="1.5"/>
  <!-- Arabic calligraphy stroke (Bismillah-inspired) -->
  <path d="M22 33 Q26 30 30 33 M34 33 Q38 30 42 33" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Crescent moon above book -->
  <path d="M28 20 A6 6 0 1 0 34 24 A4 4 0 1 1 28 20 Z" fill="url(#accent-grad)"/>
</svg>
